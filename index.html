    imageArray.forEach((image) => {
      const imgElement = document.createElement("img")
      imgElement.setAttribute("src", image.url)
      imgElement.setAttribute("class", "size-full")

      const overlayElement = document.createElement("div")
      overlayElement.setAttribute(
        "class",
        "absolute group-hover:opacity-100 transition duration-500 opacity-0 bg-gradient-to-t from-black via-transparent z-10 inset-0 flex"
      )

      const detElement = `
		<div class="mt-auto translate-y-10 group-hover:translate-y-0 transition duration-500">
			<div class="flex p-4 text-sm text-white">
				<div class="flex flex-col gap-1">
					<span class="text-xs">Uploaded By:</span>
					<h3 class="font-semibold">${image.name}</h3>
					<p>${new Date(image.date).toDateString()}</p>
				</div>
			</div>
		</div>
	  `
      overlayElement.innerHTML = detElement

      const contElement = document.createElement("div")
      contElement.setAttribute(
        "class",
        "mb-4 bg-slate-400 rounded-md overflow-hidden relative group"
      )
      contElement.appendChild(imgElement)
      contElement.appendChild(overlayElement)

      //   imgElement.setAttribute("width", "400")
      document.getElementById("container").appendChild(contElement)
